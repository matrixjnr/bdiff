name: bdiff

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test

      - name: Fixture smoke (walk mode)
        shell: bash
        run: |
          set +e
          target/debug/bdiff dirs fixtures/parse-amount/old fixtures/parse-amount/new --no-trace
          ec=$?
          set -e
          if [ "$ec" -ne 1 ]; then
            echo "expected exit 1 (changes found), got $ec"
            exit 1
          fi

  self-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace

      - name: Build
        run: cargo build

      - name: bdiff on own change
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            target/debug/bdiff rev HEAD~1 HEAD
          else
            echo "first commit; nothing to diff against"
          fi
